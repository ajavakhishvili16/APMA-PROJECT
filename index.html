<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saleroom Verdict</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#141A20; --muted:#697585; --rule:#DDE1E6;
  --bonhams:#27424B; --phillips:#B2572F; --good:#2F6B4F; --bad:#9A3B32;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:820px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:32px 40px}

header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:28px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.6vw,30px);margin:0;letter-spacing:-.01em}

.verdict{border:1px solid var(--rule);border-radius:3px;padding:30px 28px 32px}
.artist{font-family:var(--serif);font-size:clamp(22px,3.4vw,30px);font-weight:600;line-height:1.2;text-wrap:balance}
.artist a{color:inherit;text-decoration:none}
.artist a:hover{text-decoration:underline;text-underline-offset:4px}
.artist a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.title{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px;margin:6px 0 22px;
  line-height:1.35;text-wrap:balance}

.top{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:30px;
  padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--rule)}
@media(max-width:620px){.top{grid-template-columns:1fr;gap:22px}}
.scalebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.canvasframe{display:flex;align-items:center;justify-content:center;height:210px;width:100%}
#shape{border:1.5px solid var(--ink);
  background:repeating-linear-gradient(45deg,transparent,transparent 6px,
    color-mix(in srgb,var(--ink) 7%,transparent) 6px,color-mix(in srgb,var(--ink) 7%,transparent) 7px);
  transition:width .55s cubic-bezier(.22,.8,.3,1),height .55s cubic-bezier(.22,.8,.3,1)}
.dims{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;text-align:center}
.ref{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);letter-spacing:.05em}
.refbar{height:1px;background:var(--muted);display:block}
.detail{min-width:0;display:flex;flex-direction:column;justify-content:center}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 22px;margin:0;font-size:14.5px}
dt{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;align-self:center}
dd{margin:0;font-variant-numeric:tabular-nums}
.meterhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.mlabel{font-size:11px;letter-spacing:.11em;text-transform:uppercase}
.mlabel.b{color:var(--bonhams)} .mlabel.p{color:var(--phillips)}
.readout{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}

.track{position:relative;height:34px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--bonhams) 17%,transparent),
    color-mix(in srgb,var(--bonhams) 4%,transparent) 42%,
    color-mix(in srgb,var(--phillips) 4%,transparent) 58%,
    color-mix(in srgb,var(--phillips) 17%,transparent))}
.mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule)}
.needle{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--ink);left:50%;
  transform:translateX(-50%);transition:left .9s cubic-bezier(.3,.9,.3,1),background .3s}
.needle.b{background:var(--bonhams)} .needle.p{background:var(--phillips)}

.outcome{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px;min-height:32px}
.badge{font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding:6px 12px;border-radius:2px;
  border:1px solid currentColor;opacity:0;transform:translateY(5px);transition:opacity .35s,transform .35s}
.badge.show{opacity:1;transform:none}
.badge.ok{color:var(--good)} .badge.no{color:var(--bad)}
.truth{font-size:14px;color:var(--muted);opacity:0;transition:opacity .35s}
.truth.show{opacity:1}
.truth b{color:var(--ink);font-weight:600}

.bar{margin-top:18px}
.btns{display:flex;gap:7px;flex-wrap:wrap}
button{font-family:inherit;font-size:12.5px;padding:7px 14px;border:1px solid var(--rule);
  background:var(--bg);color:var(--ink);border-radius:2px;cursor:pointer;transition:border-color .2s}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tally{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pip{width:9px;height:9px;border:1px solid var(--rule);border-radius:50%;transition:all .3s}
.pip.ok{background:var(--good);border-color:var(--good)}
.pip.no{background:var(--bad);border-color:var(--bad)}
.pip.now{box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 25%,transparent)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Saleroom Verdict</h1>
    <div class="tally">
      <span id="score">&mdash;</span>
      <span class="pips" id="pips"></span>
    </div>
  </header>

  <div class="verdict">
    <div class="top">
      <div class="scalebox">
        <div class="canvasframe"><div id="shape" style="width:60px;height:60px"></div></div>
        <div class="dims" id="dims">&nbsp;</div>
        <div class="ref"><span class="refbar" id="refbar"></span><span>1 metre</span></div>
      </div>
      <div class="detail">
        <div class="artist" id="artist">&nbsp;</div>
        <div class="title" id="title">&nbsp;</div>
        <dl>
          <dt>Medium</dt><dd id="medium">&nbsp;</dd>
          <dt>Created</dt><dd id="period">&nbsp;</dd>
          <dt>Estimate</dt><dd id="est">&nbsp;</dd>
          <dt>Realised</dt><dd id="price">&nbsp;</dd>
        </dl>
      </div>
    </div>

    <div class="meterhead">
      <span class="mlabel b">&#9664; Bonhams</span>
      <span class="readout" id="readout">awaiting lot</span>
      <span class="mlabel p">Phillips &#9654;</span>
    </div>
    <div class="track"><div class="mid"></div><div class="needle" id="needle"></div></div>
    <div class="outcome">
      <span class="badge" id="badge">&nbsp;</span>
      <span class="truth" id="truth"></span>
    </div>
  </div>

  <div class="bar">
    <div class="btns">
      <button id="play">Pause</button>
      <button id="prev">Previous</button>
      <button id="next">Next</button>
      <button id="restart">Restart</button>
    </div>
  </div>
</div>

,"h":90.5,"w":60.0,"price":8088.96,"price_usd":8088.96,"est_lo":4596.0,"est_hi":6894.0,"fame":0.6931471805599451,"exposure":"local","url":"https://www.bonhams.com/auction/31788/lot/16/","p":0.7761638896078926,"actual":"Bonhams"},{"artist":"Pierre-Auguste Renoir","title":"Portrait de Gabrielle","medium_text":"oil on canvas","medium":"oil","support":"canvas","period":"1900_44","h":14.2,"w":10.0,"price":59199.24087573817,"price_usd":58880.0,"est_lo":50000.0,"est_hi":70000.0,"fame":4.75359019110636,"exposure":"established","url":"https://www.bonhams.com/auction/32380/lot/20/","p":0.051034730999620116,"actual":"Bonhams"},{"artist":"Robert Nava","title":"Drawing","medium_text":"crayon, graphite and marker on paper","medium":"drawing","support":"paper","period":"2000plus","h":44.5,"w":35.6,"price":7095.0,"price_usd":7095.0,"est_lo":5000.0,"est_hi":7000.0,"fame":0.0,"exposure":"established","url":"https://www.phillips.com/detail/robert-nava/239820","p":0.8002916164456391,"actual":"Phillips"},{"artist":"Travis Fish","title":"Gucci","medium_text":"acrylic and sharpie on velvet","medium":"acrylic","support":"other","period":"2000plus","h":25.200000000000003,"w":20.5,"price":522.7211864273752,"price_usd":518.03292315978,"est_lo":1338.5863647539545,"est_hi":2007.8795471309315,"fame":0.0,"exposure":"1-lot","url":"https://www.phillips.com/detail/travis-fish/233212","p":0.7543427282003603,"actual":"Phillips"}],"overall_acc":0.8697091510995507,"n_test":8458,"auc":0.8901};

<script>
(function(){
  const L = DATA.lots, N = L.length;
  const $ = id => document.getElementById(id);

  const MAXDIM = Math.max(...L.map(l => Math.max(l.h, l.w)));
  const PX_PER_CM = 190 / MAXDIM;           // one scale for every lot, so sizes compare
  const PERIOD = {unknown:'not recorded', pre1800:'before 1800', '1800s':'19th century',
    '1900_44':'1900\u201344', '1945_69':'1945\u201369', '1970_99':'1970\u201399', '2000plus':'2000 or later'};
  const money = v => '$' + Math.round(v).toLocaleString('en-US');

  let i = -1, playing = true, timers = [], marks = new Array(N).fill(null);

  $('refbar').style.width = (100 * PX_PER_CM) + 'px';
  $('pips').innerHTML = L.map((_,k)=>`<span class="pip" data-k="${k}"></span>`).join('');

  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const after = (ms, fn) => timers.push(setTimeout(fn, ms));

  function paintScore(){
    const done = marks.filter(m => m !== null);
    const ok = done.filter(Boolean).length;
    $('score').textContent = done.length ? `${ok} / ${done.length} correct` : '\u2014';
    document.querySelectorAll('.pip').forEach((p,k)=>{
      p.className = 'pip' + (marks[k]===true?' ok':marks[k]===false?' no':'') + (k===i?' now':'');
    });
  }

  function show(k){
    clear();
    i = (k + N) % N;
    const l = L[i];

    const artist = $('artist');
    artist.textContent = '';
    const link = document.createElement('a');
    link.href = l.url; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = l.artist;
    artist.appendChild(link);
    $('title').textContent = l.title;
    const med = l.medium_text ? l.medium_text.charAt(0).toLowerCase() + l.medium_text.slice(1) : 'not recorded';
    $('medium').textContent = med;
    $('period').textContent = PERIOD[l.period] || l.period;
    $('est').textContent = (l.est_lo && l.est_hi) ? `${money(l.est_lo)} \u2013 ${money(l.est_hi)}` : 'not published';
    $('price').textContent = money(l.price_usd);
    $('dims').textContent = `${l.h.toFixed(1)} \u00d7 ${l.w.toFixed(1)} cm`;
    $('shape').style.width  = Math.max(6, l.w * PX_PER_CM) + 'px';
    $('shape').style.height = Math.max(6, l.h * PX_PER_CM) + 'px';

    const n = $('needle');
    n.className = 'needle'; n.style.left = '50%';
    $('readout').textContent = 'weighing the characteristics\u2026';
    $('badge').className = 'badge'; $('badge').textContent = '\u00a0';
    $('truth').className = 'truth'; $('truth').textContent = '';
    paintScore();

    after(700, () => {
      const pct = l.p * 100;
      n.style.left = pct + '%';
      n.classList.add(l.p >= .5 ? 'p' : 'b');
      $('readout').textContent = `P(Phillips) = ${pct.toFixed(1)}%`;
    });

    after(1850, () => {
      const said = l.p >= .5 ? 'Phillips' : 'Bonhams';
      const right = said === l.actual;
      marks[i] = right;
      $('badge').textContent = right ? 'Correct' : 'Wrong';
      $('badge').className = 'badge show ' + (right ? 'ok' : 'no');
      $('truth').className = 'truth show';
      $('truth').innerHTML = `Model said <b>${said}</b> \u00b7 sold by <b>${l.actual}</b>`;
      paintScore();
    });

    if (playing) after(3900, () => show(i + 1));
  }

  $('play').onclick = () => {
    playing = !playing;
    $('play').textContent = playing ? 'Pause' : 'Play';
    if (playing) show(i + 1); else clear();
  };
  $('next').onclick = () => { playing = false; $('play').textContent = 'Play'; show(i + 1); };
  $('prev').onclick = () => { playing = false; $('play').textContent = 'Play'; show(i - 1); };
  $('restart').onclick = () => { marks = new Array(N).fill(null); playing = true;
    $('play').textContent = 'Pause'; show(0); };

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') $('next').click();
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  });

  show(0);
})();
</script>
</body>
</html>
